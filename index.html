<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Temp Tracker</title>
  <link rel="icon" type="image/png" href="imagenes/favicon.jpg" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="contenedor">

    <!-- Buscador -->
    <div class="buscador">
      <input
        type="text"
        placeholder="Ingresa nombre de la ciudad"
        spellcheck="false"
        autocomplete="off"
        id="input-ciudad"
      />
      <button onclick="obtenerClima()">
        <img src="imagenes/buscar.png" alt="Buscar" />
      </button>
    </div>

    <!-- Resultado del clima -->
    <div class="clima-info">
      <p class="clima-texto">Parcialmente nublado</p>
      <img src="imagenes/clima-ejemplo.webp" class="clima-icono" alt="Ícono del clima" />
      <h1 class="temp">22ºC</h1>
      <h2 class="ciudad">Huancayo</h2>

      <div class="detalles">
        <div class="col">
          <img src="imagenes/humedad.png" alt="Icono humedad" />
          <div>
            <p class="humedad">50%</p>
            <p>Humedad</p>
          </div>
        </div>

        <div class="col">
          <img src="imagenes/viento.png" alt="Icono viento" />
          <div>
            <p class="viento">15 km/h</p>
            <p>Viento</p>
          </div>
        </div>
      </div>
    </div>

  </div>

  <script src="app.js"></script>
</body>
</html>
